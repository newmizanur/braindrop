name: Release (manual)

# Manual-only. Nothing here runs on push or on a schedule, and the image is
# only pushed when `publish_image` is explicitly enabled. The workflow is kept
# in the repository so a release can reuse the same scripts as local CI.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. v0.1.0 (used as the image tag)
        required: true
        type: string
      publish_image:
        description: Push the multi-arch image to GHCR
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  native:
    name: Native archives (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: >-
              x86_64-unknown-linux-musl
              aarch64-unknown-linux-musl
              x86_64-unknown-linux-gnu
              aarch64-unknown-linux-gnu
          - os: macos-14
            targets: >-
              aarch64-apple-darwin
              x86_64-apple-darwin
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up QEMU (Linux ARM64 builds)
        if: runner.os == 'Linux'
        # v3
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Build the SPA once
        run: ./scripts/build-frontend.sh

      - name: Build and package every target
        env:
          SKIP_FRONTEND: "1"
        run: |
          set -euo pipefail
          for target in ${{ matrix.targets }}; do
            ./scripts/build-native.sh "$target"
            ./scripts/package.sh "$target"
          done

      - name: Upload archives
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: braindrop-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  image:
    name: Multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up QEMU
        # v3
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Buildx
        # v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        if: inputs.publish_image
        # v3
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        # v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ inputs.version }}
            BUILD_SHA=${{ github.sha }}
          push: ${{ inputs.publish_image }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
