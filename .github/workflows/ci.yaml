name: CI

# Automatic runs are disabled for now to avoid consuming hosted-runner
# credits. The same Docker-first pipeline runs locally with `./scripts/ci.sh`;
# this workflow is kept as a manual fallback and reuses that script so the two
# paths cannot drift.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-ci:
    name: Docker CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run local CI pipeline
        run: ./scripts/ci.sh
