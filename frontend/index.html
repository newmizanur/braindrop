<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BrainDrop — capture anything, organize automatically. A self-hostable personal inbox, task and reminder manager."
    />
    <meta name="theme-color" content="#4c6ef5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BrainDrop" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>BrainDrop</title>
    <script>
      // Resolve the Mantine color scheme before first paint to avoid a flash.
      ;(() => {
        try {
          const stored = localStorage.getItem('mantine-color-scheme-value')
          const scheme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute(
            'data-mantine-color-scheme',
            scheme,
          )
        } catch {
          document.documentElement.setAttribute(
            'data-mantine-color-scheme',
            'light',
          )
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
