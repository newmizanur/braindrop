# Loco configuration file documentation
#
# This is the production environment. It differs from development in one
# deliberate way: anything that is a secret or an address takes no default.
# `get_env(name="X")` with no `default` fails at startup if `X` is unset, which
# is what you want — a production app that silently falls back to a development
# secret or a localhost database is worse than one that refuses to boot.
#
# The variables this file requires:
#   DATABASE_URL, QUEUE_URL, JWT_SECRET and HOST. Mail is optional and only
#   reads MAILER_* when MAILER_ENABLED=true; AI and notifications have safe
#   empty defaults.

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: true
  # Enable pretty backtrace (sets RUST_BACKTRACE=1). Off in production: it
  # costs performance and puts source paths into your logs.
  pretty_backtrace: false
  # Log level, options: trace, debug, info, warn or error.
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  # Define the logging format. options: compact, pretty or json
  # `json` is the machine-readable one, for a log aggregator.
  format: json
  # By default the logger has filtering only logs that came from your code or logs that came from `loco` framework. to see all third party libraries
  # Uncomment the line below to override to see all third party libraries you can enable this config and override the logger filters.
  # override_filter: trace

# Web server configuration
server:
  # Port on which the server will listen. the server binding is 0.0.0.0:{PORT}
  port: <%= get_env(name="PORT", default="5150") %>
  # Binding for the server (which interface to bind to).
  # `0.0.0.0`, not `localhost`: inside a container or a VM, a server bound to
  # loopback is unreachable from outside it.
  binding: <%= get_env(name="BINDING", default="0.0.0.0") %>
  # The UI hostname or IP address that mailers will point to.
  # Required: links in outgoing mail have to name the real host.
  host: <%= get_env(name="HOST") %>
  # Out of the box middleware configuration. to disable middleware you can changed the `enable` field to `false` of comment the middleware block
  middlewares:
    limit_payload:
      # All API bodies are JSON text; 1 MiB is generous for a personal inbox.
      body_limit: 1mb
    fallback:
      enable: false
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/"
        path: "frontend/dist"
      fallback: "frontend/dist/index.html"
    remote_ip:
      # Rate limiting uses this address. Keep `ConnectInfo` when the app is
      # exposed directly. Behind one trusted reverse proxy that sets a correct
      # X-Forwarded-For, set REMOTE_IP_SOURCE=RightmostXForwardedFor. Never
      # trust a header from an untrusted edge.
      enable: true
      source: <%= get_env(name="REMOTE_IP_SOURCE", default="ConnectInfo") %>
    secure_headers:
      # Explicit headers are clearer than a preset: some Loco presets clear
      # browser storage and disable the PWA's static caching. HSTS is set by
      # the TLS reverse proxy, never by an app that cannot see TLS itself.
      enable: true
      preset: empty
      overrides:
        "Content-Security-Policy": "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
        "X-Content-Type-Options": "nosniff"
        "X-Frame-Options": "DENY"
        "Referrer-Policy": "no-referrer"
        "Permissions-Policy": "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        "Cross-Origin-Opener-Policy": "same-origin"
        "Cross-Origin-Resource-Policy": "same-origin"

# Worker Configuration
workers:
  # specifies the worker mode. Options:
  #   - BackgroundQueue - Workers operate asynchronously in the background, processing queued.
  #   - ForegroundBlocking - Workers operate in the foreground and block until tasks are completed.
  #   - BackgroundAsync - Workers operate asynchronously in the background, processing tasks with async capabilities.
  mode: BackgroundQueue

  
# Queue Configuration
queue:
  kind: Sqlite
  max_connections: 2
  num_workers: 2
  
  # SQLite connection URI
  uri: <%= get_env(name="QUEUE_URL") %>
  # Dangerously flush all data in the queue table on startup. dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_flush: false
  

# Scheduler Configuration
# Started by `braindrop-cli start --all` (server + worker + scheduler). The scan
# tasks are idempotent, so a missed or repeated tick is safe.
scheduler:
  jobs:
    notification-reminders:
      run: "notifications:reminders"
      schedule: "0 * * * * *"
    notification-digests:
      run: "notifications:digests"
      schedule: "0 * * * * *"
    notification-overdue:
      run: "notifications:overdue"
      schedule: "0 0 * * * *"
    notification-recover:
      run: "notifications:recover"
      schedule: "0 * * * * *"
    notification-cleanup:
      run: "notifications:cleanup"
      schedule: "0 15 3 * * *"

# Mailer Configuration.
#
# Mail is optional. A small self-hosted install with public registration
# disabled does not need SMTP, so the mailer is off unless explicitly enabled.
# Set MAILER_ENABLED=true and fill in the SMTP settings before turning on
# email verification, password reset or magic links.
mailer:
  # SMTP mailer configuration.
  smtp:
    # Enable/Disable smtp mailer.
    enable: <%= get_env(name="MAILER_ENABLED", default="false") %>
    # SMTP server host. e.x localhost, smtp.gmail.com
    # Quoted so an empty value stays an empty string instead of YAML null.
    host: "<%= get_env(name="MAILER_HOST", default="localhost") %>"
    # SMTP server port
    port: <%= get_env(name="MAILER_PORT", default="587") %>
    # Use secure connection (SSL/TLS).
    secure: <%= get_env(name="MAILER_SECURE", default="true") %>
    auth:
      # The YAML values must be strings even when empty, otherwise the mailer
      # config parser sees a null and refuses to boot.
      user: "<%= get_env(name="MAILER_USER", default="") %>"
      password: "<%= get_env(name="MAILER_PASSWORD", default="") %>"
    # Override the SMTP hello name (default is the machine's hostname)
    # hello_name:

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Database Configuration
database:
  # Database connection URI. Required — there is no safe default for a
  # production database.
  uri: <%= get_env(name="DATABASE_URL") %>
  # When enabled, the sql query will be logged.
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  # Set the timeout duration when acquiring a connection.
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  # Set the idle duration before closing a connection.
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  # Minimum number of connections for a pool.
  min_connections: 1
  # SQLite is single-writer; four connections provide modest read concurrency.
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="4") %>
  # Run migration up when application loaded.
  # Convenient for single-instance deploys. Turn it off if you run more than
  # one instance or migrate as a separate release step, so instances do not
  # race to migrate the same database.
  auto_migrate: <%= get_env(name="DB_AUTO_MIGRATE", default="true") %>
  # Truncate database when application loaded. This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_truncate: false
  # Recreating schema when application loaded.  This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_recreate: false

# Application settings. Read through `ctx.config.settings()`; never read the
# environment directly from application code.
settings:
  auth:
    # Public registration is disabled by default. The first account is created
    # with `braindrop-cli task admin:create`.
    allow_registration: <%= get_env(name="ALLOW_REGISTRATION", default="false") %>
    # Enable to require email verification before login. Only useful when
    # outbound mail is configured.
    require_email_verification: <%= get_env(name="REQUIRE_EMAIL_VERIFICATION", default="false") %>
  # Optional AI-assisted capture. Every value has a safe empty default so an
  # installation without AI credentials boots and works normally.
  ai:
    enabled: <%= get_env(name="AI_ENABLED", default="false") %>
    api_key: <%= get_env(name="OPENROUTER_API_KEY", default="") %>
    model: <%= get_env(name="OPENROUTER_MODEL", default="") %>
    base_url: <%= get_env(name="OPENROUTER_BASE_URL", default="https://openrouter.ai/api/v1") %>
    timeout_seconds: <%= get_env(name="AI_TIMEOUT_SECONDS", default="30") %>
    max_input_chars: <%= get_env(name="AI_MAX_INPUT_CHARS", default="8000") %>
    max_output_chars: 64000
    max_items: 20
    rate_limit_per_minute: <%= get_env(name="AI_RATE_LIMIT_PER_MINUTE", default="10") %>
    # Required only for personal (BYOK) keys. Generate with
    # `openssl rand -base64 32` and keep it stable: rotating it makes stored
    # personal keys unreadable (users must re-enter them).
    encryption_key: <%= get_env(name="AI_ENCRYPTION_KEY", default="") %>
  # Optional Telegram and Discord delivery. Both are off until a user enables
  # them and stores credentials. The server only supplies the official
  # endpoints, the limits and the key used to seal stored credentials.
  notifications:
    # Falls back to AI_ENCRYPTION_KEY when empty, so one key covers both.
    encryption_key: <%= get_env(name="NOTIFICATION_ENCRYPTION_KEY", default="") %>
    telegram_api_base: <%= get_env(name="TELEGRAM_API_BASE", default="https://api.telegram.org") %>
    discord_api_base: <%= get_env(name="DISCORD_API_BASE", default="https://discord.com") %>
    timeout_seconds: <%= get_env(name="NOTIFICATION_TIMEOUT_SECONDS", default="10") %>
    max_attempts: <%= get_env(name="NOTIFICATION_MAX_ATTEMPTS", default="5") %>
    retry_base_seconds: <%= get_env(name="NOTIFICATION_RETRY_BASE_SECONDS", default="30") %>
    retry_max_seconds: <%= get_env(name="NOTIFICATION_RETRY_MAX_SECONDS", default="3600") %>
    stale_processing_minutes: 15
    history_retention_days: <%= get_env(name="NOTIFICATION_HISTORY_RETENTION_DAYS", default="30") %>
    test_rate_limit_per_minute: <%= get_env(name="NOTIFICATION_TEST_RATE_LIMIT", default="5") %>
    reminder_grace_hours: 24
    digest_window_minutes: 120
    max_message_items: 10
    telegram_max_chars: 4096
    discord_max_chars: 2000
    recovery_batch: 100

# Per-user AI rate limiting. In-memory is correct for the single-instance
# deployment this app targets; a restart clears the counters.
cache:
  kind: InMem
  max_capacity: 1048576


# Authentication Configuration
auth:
  # JWT authentication
  jwt:
    # Secret key for token generation and verification. Required: a secret
    # committed to the repository is a secret your users can forge tokens with.
    # It must be standard base64 (Loco decodes it before signing), e.g. the
    # output of `openssl rand -base64 32`.
    secret: <%= get_env(name="JWT_SECRET") %>
    # Token expiration time in seconds
    expiration: 604800 # 7 days
